[package]
name = "sui-dockerfile-prewarmer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Standing pre-warming service — polls watched public Dockerfiles for new commits and keeps sui's cache warm via sui-dockerfile-wrapper (supa-charge-ci Phase 3)"
keywords = ["nix", "docker", "cache", "ci"]
categories = ["caching"]

[[bin]]
name = "sui-dockerfile-prewarmer"
path = "src/main.rs"

[dependencies]
sui-spec.workspace = true
sui-cache.workspace = true
sui-dockerfile-wrapper.workspace = true
# REUSE the Viggy machinery — the `Controller` trait / `ReconcileOutcome`
# seven-beat contract + the `WarmthVerdict`/`WarmthBreach` promessa
# vocabulary — from the sibling super-cache-ci crate. The layers-stay-warm
# loop does NOT re-roll a PromessaController; it mirrors preheat's shape
# over the prewarmer's own observable (watched-graph seen-ratio).
sui-supercacheci.workspace = true
# The typed warm STEP is a shigoto Dag of re-warm Jobs (not a bare loop).
shigoto-dag.workspace = true
shigoto-types.workspace = true
# The OutcomeChain attestation is a BLAKE3 content-addressed hash chain
# (tier-honest: a hash chain, NOT an Ed25519-signed chain — see viggy.rs).
blake3.workspace = true
# Hex-encode the 32-byte content-addressed link ids for JSON-safe,
# human-diffable chain serialization.
data-encoding.workspace = true
shikumi = "0.1"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
async-trait.workspace = true
anyhow.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process", "time", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `net` + `io-util`: the resilience tests stand up a throwaway in-process
# TCP HTTP server to drive the REAL `RealCommitsApi` reqwest transport
# against genuine failure modes (rate-limit, malformed JSON, 404,
# connection-refused) with zero new external dependencies.
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }

[lints.clippy]
pedantic = "warn"

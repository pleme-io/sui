description = "canteiro's shared, wire-serializable CI-run types + the DAG decompose/affected-set algebra (CANTEIRO §7.1-C). Lean deps (serde + shigoto-dag/-types) so a consumer — e.g. a caixa `:kind Acao` renderer — gets a typed CiRun WITHOUT pulling sui-supercacheci's execution tree (tokio/axum/sea-orm)."
keywords = ["nix", "sui", "ci", "canteiro", "dag"]

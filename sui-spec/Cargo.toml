[package]
name = "sui-spec"
description = "Declarative Lisp-authored specs for CppNix-parity behaviors. Rust types are the hard boundary; Lisp forms are the free-middle authoring surface. Both engines (tree-walker + VM) drive the same spec, so they cannot drift."
keywords = ["nix", "parity", "testing", "lisp", "tatara"]
categories = ["development-tools::testing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# kazari (飾り) — the fleet line-output typescape. sui's style.rs routes every
# styled byte through kazari's typed, capability-honest (truecolor → 256 → 16 →
# plain), format!()-free emission instead of hand-rolled ANSI. Published on
# crates.io as `pleme-io-kazari` (the bare `kazari` name is squatted upstream by
# an unrelated 2021 crate); the `package` rename keeps every `use kazari::`
# unchanged. A crates.io version dep (not git) so sui-spec itself is publishable
# — a git dep here is exactly what froze sui-spec at 0.1.118 and auto-deferred
# every crate downstream of it.
kazari = { package = "pleme-io-kazari", version = "0.1" }
tatara-lisp.workspace = true
tatara-lisp-derive.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
base64.workspace = true
sui-compat.workspace = true
url = "2"
regex.workspace = true

# L1 substrate — rkyv archives + BLAKE3 content addressing for the
# typed graph forms (lockfile_graph + ast_graph today; module_graph next).
rkyv.workspace = true
bytecheck.workspace = true
blake3.workspace = true

# rnix typed AST + rowan CST — used by the ast_graph bridge that lowers
# parsed Nix expressions into the content-addressed L1 form.
rnix.workspace = true
rowan.workspace = true

# Real-fetcher runtime — ureq is the blocking-HTTP transport, tar +
# flate2 handle on-the-wire tarball unpack inside `builtins.fetchTarball`
# / `builtins.fetchTree`.  Pure-Rust everywhere — no openssl, no
# libgit2 — to keep the static-link story clean.
ureq.workspace = true
tar.workspace = true
flate2.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
pretty_assertions.workspace = true

# Needed by the dual-exec runner for SIGKILL on timeout.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "sui-sweep"
path = "src/bin/sui-sweep.rs"

[[bin]]
name = "sui-spec-inventory"
path = "src/bin/sui-spec-inventory.rs"

[lints.clippy]
pedantic = "warn"

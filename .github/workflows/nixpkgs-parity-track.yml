# nixpkgs-parity-track — THE MACHINE (phase 0): sui continuously + publicly
# proves it tracks the LATEST nixpkgs.
#
# The standing `parity.yml` gate runs `sui parity` against whatever nixpkgs the
# runner happens to carry, on every push. THIS workflow is the continuous
# TRACKING half: on a daily schedule it pins `<nixpkgs>` to the current
# `nixpkgs-unstable` HEAD and runs the same byte-parity corpus, so a divergence
# introduced by an upstream nixpkgs change (not a sui change) surfaces as a red,
# public, dated check — the exact signal that let us find + close the neovim /
# python27 `callPackage` root.
#
# Philosophy (operator): build + improve + FIX the machine, not chase coverage.
# Every red run is a real divergence to root-cause + fix in the eval core (like
# neovim), then the corpus grows by one honest, byte-verified row. "How far we
# get" is an output we earn, never a number we round up.
#
# ── The machine, phased (this file is phase 0) ────────────────────────────────
#   P0 (HERE): scheduled eval-parity vs latest nixpkgs, in sui's own CI.
#   P1: extract the run into `pleme-io/actions/sui-eval-parity` (a tlisp-backed
#       reusable action) + a `substrate` reusable workflow — the 3-line consumer
#       shim, per the AUTO-RELEASE pattern.
#   P2: `tend.nixpkgs-track` job kind — tend polls the nixpkgs channel ref
#       (it already polls tags for akeyless-matrix) and dispatches this pipeline
#       on a new commit, so tracking is daemon-driven, not only cron.
#   P3: BUILD-parity basket — realize a growing set of derivations with sui and
#       byte-compare the NAR to nix's (the genuinely-new harness).
#   P4: tameshi-attested public receipt + a README badge
#       (`sui ⟷ nixpkgs@<sha>: N eval ✓ · M build ✓ · 0 diverge`).
# See docs/NIXPKGS-PARITY-MACHINE.md for the full design + tier-honest ledger.

#
# ── FIXED 2026-08-04: the package spec was stale and this job could not pass.
# `-p sui` names no package; the crate was renamed to `pleme-io-sui` in 5f76b39
# ("bare 'sui' is squatted upstream") and this workflow was never updated, so
# every run failed with `package ID specification 'sui' did not match any
# packages`. The [[bin]] is still `sui` — only the PACKAGE moved, which is why
# `--bin sui` stayed correct and the line read fine at a glance.
name: nixpkgs-parity-track

on:
  schedule:
    # Daily at 06:17 UTC — offset off the hour to avoid the cron thundering herd.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      nixpkgs-ref:
        description: "nixpkgs ref to track (default: nixpkgs-unstable HEAD)"
        required: false
        default: "nixpkgs-unstable"

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build sui
        run: cargo build -p pleme-io-sui --bin sui

      # `sui parity --track-nixpkgs <ref>` resolves the ref's CURRENT HEAD, pins
      # <nixpkgs> to it, runs the byte-corpus, and prints the exact rev — ALL in
      # the typed binary (the `nix flake metadata | jq` pin logic moved into
      # `resolve_nixpkgs_rev`, no shell). A non-zero exit is a real sui-vs-nix
      # divergence on the current nixpkgs — the public, dated red check that
      # drives the fix loop. `| tee $GITHUB_STEP_SUMMARY` is the one line of glue.
      - name: Run byte-parity gate vs tracked nixpkgs (typed)
        run: |
          ./target/debug/sui parity --track-nixpkgs "${{ github.event.inputs.nixpkgs-ref || 'nixpkgs-unstable' }}" | tee "$GITHUB_STEP_SUMMARY"

name: canteiro-crux
on:
  workflow_dispatch: {}
jobs:
  build:
    name: canteiro · build
    runs-on: camelot-builder-pleme-eks
    steps:
    - uses: actions/checkout@v4
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        github-token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
        determinate: false
        extra-conf: |
          experimental-features = nix-command flakes
          accept-flake-config = true
          sandbox = relaxed
          access-tokens = github.com=${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
    - name: Run build
      run: |
        # Proven camelot build env (see canteiro-m1.yml): openssl-sys needs
        # pkg-config + the openssl .pc; a bare `nix shell` with only cargo/rustc/gcc
        # lacks them. OPENSSL_NO_VENDOR=1 uses nix's openssl, not a vendored build.
        OPENSSL_DEV=$(nix build --no-link --print-out-paths 'nixpkgs#openssl.dev')
        nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#gcc nixpkgs#pkg-config nixpkgs#openssl \
          --command env \
            PKG_CONFIG_PATH="$OPENSSL_DEV/lib/pkgconfig" \
            OPENSSL_NO_VENDOR=1 \
            cargo build -p sui-supercacheci
  test:
    name: canteiro · test
    runs-on: camelot-builder-pleme-eks
    needs:

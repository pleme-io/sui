name: image-release

# sui ships TWO artifacts: the published crate workspace (crates.io, via
# auto-release.yml) AND a Nix-built `dockerTools` image — the super-cache /
# `cache serve` daemon the lareira-sui chart runs. This workflow is the ★★
# AUTO-RELEASE / AUTOBUMP path for the IMAGE (crates ship separately in
# auto-release.yml; the two never conflict — image-push does not bump/tag).
#
# The `sui` binary is built with `default = ["tiered"]`, so `dockerImage-amd64`
# compiles the Redis L1 + Postgres L2 tiered arms and can serve
# `cache serve --backend-config <toml>` against the TieredBackend.
#
# Runner: a GitHub-hosted runner, by routing (sui is public). sui stays on the
# public track and never couples its build to fleet runners. The push mints a
# pleme-publish App token in the job from PUBLISH_APP_ID / PUBLISH_APP_KEY
# (secrets: inherit); image-push hands it to registry-login ahead of every
# other rung.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image-amd64:
    name: sui amd64 image → ghcr.io
    # Skip the crates-bump commit auto-release.yml pushes as a bot (the
    # posture App or github-actions), so a merge builds one image, not two.
    if: ${{ !endsWith(github.actor, '[bot]') }}
    uses: pleme-io/substrate/.github/workflows/image-push.yml@main
    with:
      imageAttr: dockerImage-amd64
      imageName: pleme-io/sui
      # AUTOBUMP-friendly: `r<run_number>` makes the tag numerically SORTABLE so
      # Flux ImagePolicy (the env-subscription side) can auto-track the newest
      # build; the sha keeps it traceable. Same shape as hanabi / pangea-operator.
      tag: amd64-r${{ github.run_number }}-${{ github.sha }}
      additionalTags: amd64-latest
      # Zero-tolerance CVE gate, closed 2026-07 -- sui is a real,
      # actually-running in-cluster service (the super-cache daemon) that had
      # never had one, unlike breathe-controller/ensaio/pangea-operator
      # (all three wired the same way). Scans the LOCAL image.tar.gz
      # BEFORE the push step, same shape + same rationale as those three
      # -- see this reusable workflow's own header comment for the
      # pangea-operator incident (a post-publish-only scan let a CRITICAL
      # image run in-cluster for ~1.5h before it self-healed). No
      # `.trivyignore` yet -- sui has no tracked exceptions; add one only
      # if a real, justified finding needs it.
      scanBeforePush: true
      scanFailOnSeverity: "UNKNOWN"
    secrets: inherit

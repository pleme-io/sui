# canteiro-m1 — the LIVE proof of canteiro M1 on a real self-hosted ARC worker.
#
# It builds + runs the `canteiro-run` binary (sui-supercacheci) on an isolated
# 100%-spot scale-to-zero ARC pool. The pool label is NOT hardcoded here: it is
# read from `vars.PRIVATE_BUILDER_RUNNER`, the fleet-wide variable the
# image-push jobs already resolve, and falls back to a GitHub-hosted runner when
# that variable is unset — so neither side of a pool rename is a flag day, and
# a fork with no self-hosted pool still runs the job. `canteiro-run`
# decomposes a 2-node `build → test` CiRun (both env=None, trivial `true`
# actions), drives it through `run_in_process` (decompose → in-process shigoto
# wave execution), and exits 0 iff BOTH nodes reach the green terminal.
#
# HONEST SCOPE: this proves the canteiro MACHINERY runs green on a live worker
# (decompose → wave execution → both Succeeded), NOT "a real build+test with
# real compilation work" — the node actions are deliberately trivial for this
# first proof (CANTEIRO §7).
#
# TRIGGER: workflow_dispatch ONLY. There is deliberately NO `on: push` — the
# live ARC run must be a DELIBERATE operator trigger, never an automatic one.
#
# BUILD INVOCATION: the self-hosted ARC runner does not ship a Rust toolchain;
# the proven pattern on that pool (image-push.yml) is to install Nix
# (DeterminateSystems) and pull tools from nixpkgs via `nix shell`. We reuse
# that pattern — `nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#gcc` — because
# nixpkgs' cargo/rustc is well past the workspace's rust-version 1.89.0 /
# edition 2024 requirement and `gcc` supplies the C linker rustc needs. This is
# grounded in what actually works on the self-hosted builder pool, not sui's
# other workflows which run on GitHub-hosted ubuntu-latest with
# dtolnay/rust-toolchain.

name: canteiro-m1

on:
  workflow_dispatch:

jobs:
  canteiro-run:
    name: canteiro M1 — in-process wave execution on a live ARC worker
    runs-on: ${{ vars.PRIVATE_BUILDER_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # Install Nix the way the PROVEN self-hosted pattern does (substrate's
      # image-push.yml, which runs on that same pool). Load-bearing:
      # `determinate: false` installs UPSTREAM nix, not Determinate nix —
      # Determinate's systemd-daemon setup ("Create build users") HANGS on a
      # containerized ARC runner with no systemd (the first live attempt,
      # run 30163911162, was canceled there). `github-token` rate-limits the
      # installer download; `access-tokens` covers any token-gated fetch.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          determinate: false
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            sandbox = relaxed
            access-tokens = github.com=${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      # Build + run in one step: `cargo run` compiles the bin then runs it and
      # propagates its exit code, so a non-zero verdict (any node not green)
      # fails the job. cargo/rustc/gcc come from nixpkgs (edition-2024-capable,
      # past rust-version 1.89.0) — the proven toolchain source on that pool.
      - name: Build + run canteiro-run (fails the job on any non-green node)
        run: |
          # No system C library: the workspace links none (tests/no_c_tls.rs
          # keeps OpenSSL out of Cargo.lock), so cargo/rustc/gcc are enough.
          nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#gcc \
            --command cargo run -p sui-supercacheci --bin canteiro-run

[workspace]
members = [
    "sui-intern",
    # Parse-time variable-resolution side-table (ENV-RESOLVE M0). A pure
    # `bind_vars` pass over the rnix AST + a cppnix-shaped StaticEnv chain
    # (with-scope frames as barriers) precomputes each ident's interned
    # Symbol so the tree-walker's hot Ident arm skips the per-lookup
    # re-intern. Fail-safe to Dynamic — parity-by-construction over the
    # identical im_rc map + identical lookup_fast fallback.
    "sui-resolve",
    # L3 lower-once flat IR (SPEED.md L3). Per source file one
    # `Program { exprs: Vec<Ir>, spans }` with `ExprId(u32)` indices,
    # lowered from the rnix/rowan AST exactly once. This slice is the IR
    # skeleton + total `lower()` + the rowan↔IR differential render
    # harness only — no eval-through-IR yet (that is the next,
    # separately-gated slice; dual-engine byte-diff is the flip gate).
    "sui-ir",
    "sui-bytecode",
    "sui-cache",
    "sui-compat",
    "sui-store",
    "sui-eval",
    "sui-build",
    "sui-daemon",
    "sui-orchestrate",
    "sui-cache-eval",
    # Declarative Lisp-authored specs (behavioral oracle for CppNix
    # parity). Every imperative Rust function whose body reads "this
    # is what CppNix does" is a spec that belongs here, not in the
    # engine. Rust provides typed borders; Lisp is the free-middle
    # surface; the pair generates each other.
    "sui-spec",
    # The migration-bridge wrapper.  Exposes a `nix` binary that
    # consults sui-spec's CLI coverage catalog at runtime and routes
    # Working/SuiNative commands to sui; everything else falls back
    # to real cppnix.  Operators install this at /run/current-system
    # /sw/bin/nix to immediately gain sui's typed surface while M2.6+
    # work brings the rest of the cppnix surface to byte-identity.
    "sui-nix-wrap",
    # L1 substrate — content-addressed graph store. Owns the redb
    # index + rkyv-archived blobs on a ZFS-friendly layout. Replaces
    # the SeaORM/SQLite path for lockfile / AST / module-graph
    # persistence with mmap-and-cast zero-copy reads.
    "sui-graph-store",
    # L7/L8 substrate — single source of truth for wire types across
    # every IPC link in the system: daemon ↔ local CLI (rkyv-over-UDS,
    # zero-copy), daemon ↔ remote-daemon (tonic + REAPI-shaped),
    # daemon ↔ remote-atticd (tonic + tvix-castore-shaped),
    # fleet pub/sub (NATS). Drift between client and daemon is a
    # compile error, not a runtime mystery.
    "sui-protocol",
    # L7 transport — async frame codec for the rkyv-over-UDS local
    # protocol. Reads/writes `[magic 4B][len u32 LE][rkyv body]` over
    # any tokio AsyncRead+AsyncWrite. Reusable by server, client, tests.
    "sui-daemon-frame",
    # L7 client — typed multiplexed client for the graph protocol.
    # Wraps the frame codec + offers ping/get/put/stats. Reusable by
    # sui CLI, tend, future ops tools.
    "sui-daemon-client",
    # L7 runtime — sui-daemon-graph binary. Wires GraphServer +
    # tsunagu Shutdown handler into a systemd-installable service.
    # Ships separately from sui-daemon (the library) so the binary's
    # CLI/argv surface doesn't pollute the lib's API.
    "sui-daemon-graph",
    # /super-cache-ci config surface — the typed shikumi::TieredConfig schema
    # for service-level sui (Postgres store + Redis cache + RAM/tmpfs sandbox,
    # never-touch-durable-disk). Schema + tier model only; backend + daemon
    # wiring are named LiveTODOs in the crate docs.
    # canteiro's shared, wire-serializable CI-run types + DAG algebra, extracted
    # from sui-supercacheci so a caixa `:kind Acao` renderer consumes a typed
    # CiRun without the execution tree (CANTEIRO §7.1-C).
    "canteiro-types",
    "sui-supercacheci",
    # supa-charge-akeyless-ci Phase 2 — the intercept/resolve/fall-through
    # wrapper around plain `docker build`.  Computes a sui-spec
    # DockerfileGraph, checks sui-cache's StorageBackend for each node, and
    # either materializes a cache hit or shells out to real `docker build`
    # on any miss (never a partial cache splice — see the crate docs).
    "sui-dockerfile-wrapper",
    # Phase 3 of supa-charge-akeyless-ci: the standing pre-warming
    # service that polls watched public Dockerfiles for new commits and
    # invokes sui-dockerfile-wrapper in cache-miss mode to keep the
    # cache warm ahead of any real build.
    "sui-dockerfile-prewarmer",
    # Phase 4 of supa-charge-akeyless-ci: the build equivalence checker.
    # Compares two built images' `docker history` layer sequence + final
    # filesystem content (modulo a typed volatile-path allowlist), driven
    # through sui-dockerfile-wrapper's CommandRunner seam.
    "sui-dockerfile-verify",
    # Phase 3b of supa-charge-akeyless-ci: node-local L0 disk cache
    # daemon. One instance per k8s node (DaemonSet), UDS protocol,
    # falls through to sui-cache's remote StorageBackend on local miss.
    "sui-dockerfile-node-cache-daemon",
    # The typed buildx-native-multi-arch primitive. Registers native
    # per-arch build nodes AS buildx nodes (no QEMU) with a store-backed
    # cache front on the SAME builder config, so an unchanged
    # `docker buildx build --platform amd64,arm64` dispatches to native
    # metal. Reuses sui-dockerfile-wrapper's CommandRunner seam +
    # sui-cache's storage-backend config; owns only the native-node guard
    # + topology + cache-front + keyway driver.
    "sui-bigorna",
    # porto — the pleme-io-native OCI Distribution Spec v1.1 registry
    # SERVER. Rebuilds zot's registry-server capability as native substrate:
    # an axum `/v2/` OCI registry over a mockable `RegistryStore` seam,
    # layering OCI blobs + manifests onto sui-cache's content-addressed
    # `StorageBackend` (get_nar/put_nar keyed by the OCI digest). Typed
    # `Digest` parse-at-boundary, typestate upload FSM, typed `OciError`
    # wire codes. lacre (the cartorio admission proxy) and doca (the client)
    # sit AROUND this store server; porto leaves the referrer seam for them.
    "sui-registry",
    # Shared content-addressed store backends — the `StorageBackend` trait
    # + Local/S3/Redis/Pg/Tiered implementations, shared by both sui-cache
    # and sui-registry (=porto). Extracted from sui-cache so porto does not
    # depend on the full cache server crate just for the store trait.
    "sui-castore",
]
resolver = "3"

[workspace.package]
version = "0.1.156"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/sui"

# Fleet-standard lint posture, hoisted to the workspace so every member inherits
# one uniform clippy stance via `[lints] workspace = true`. warn-level (never a
# hard build break) matching the sui convention already in ~20 members; this
# closes the 7 previously-unlinted crates (sui-eval 34.5k LoC the largest). The
# per-crate `[lints.clippy] pedantic = "warn"` blocks can consolidate onto this
# in a follow-up (solve-once).
[workspace.lints.clippy]
pedantic = "warn"

[workspace.dependencies]
# pleme-io gen — the canonical typed Nix-expression AST (theory/NIX-AST.md).
# Used by the parity corpus to build eval-surface shapes typed + render them to
# canonical Nix source (no format!() of Nix syntax), replacing the interim local
# mirror. Published on crates.io.
gen-nix = "0.1"
# Internal crates
sui-intern = { path = "sui-intern", version = "0.1.156" }
sui-resolve = { path = "sui-resolve", version = "0.1.156" }
sui-bytecode = { path = "sui-bytecode", version = "0.1.156" }
sui-cache = { path = "sui-cache", version = "0.1.156" }
sui-compat = { path = "sui-compat", version = "0.1.156" }
sui-store = { path = "sui-store", version = "0.1.156" }
sui-eval = { path = "sui-eval", version = "0.1.156" }
sui-ir = { path = "sui-ir", version = "0.1.156" }
sui-build = { path = "sui-build", version = "0.1.156" }
sui-daemon = { path = "sui-daemon", version = "0.1.156" }
sui-orchestrate = { path = "sui-orchestrate", version = "0.1.156" }
sui-cache-eval = { path = "sui-cache-eval", version = "0.1.156" }
sui-spec = { path = "sui-spec", version = "0.1.156" }
sui-graph-store = { path = "sui-graph-store", version = "0.1.156" }
sui-protocol = { path = "sui-protocol", version = "0.1.156" }
sui-daemon-frame = { path = "sui-daemon-frame", version = "0.1.156" }
sui-daemon-client = { path = "sui-daemon-client", version = "0.1.156" }
canteiro-types = { path = "canteiro-types", version = "0.1.156" }
sui-supercacheci = { path = "sui-supercacheci", version = "0.1.156" }
sui-dockerfile-wrapper = { path = "sui-dockerfile-wrapper", version = "0.1.156" }
sui-dockerfile-prewarmer = { path = "sui-dockerfile-prewarmer", version = "0.1.156" }
sui-dockerfile-verify = { path = "sui-dockerfile-verify", version = "0.1.156" }
sui-dockerfile-node-cache-daemon = { path = "sui-dockerfile-node-cache-daemon", version = "0.1.156" }
sui-bigorna = { path = "sui-bigorna", version = "0.1.156" }
sui-castore = { path = "sui-castore", version = "0.1.156" }

# Lisp surface for declarative specs — pleme-io's homoiconic
# S-expression reader, published on crates.io. Version-pinned to keep
# the workspace reproducible; bump in lockstep when adding a new domain
# to sui-spec.
#
# ONE dependency, deliberately: `tatara-lisp` re-exports the derive
# macros under renamed paths — `DeriveTataraDomain` / `DeriveKeywordSexp`
# (the bare `TataraDomain` / `KeywordSexp` names are the *traits*) — so a
# consumer never names `tatara-lisp-derive` itself. That is what killed
# the old lib/derive version-skew class: the two crates released on
# independent cadences, a caret range resolved the derive to a line
# emitting `::tatara_lisp::domain::parse_kwargs_strict` against a runtime
# that only exported `parse_kwargs`, and the workspace had to carry an
# exact pin to hold them in step. Naming only the lib makes that
# unrepresentable — the derive arrives as the lib's own locked
# dependency, so the pair can never disagree.
tatara-lisp = "0.3.3"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# API stack
axum = { version = "0.8", features = ["macros"] }
async-graphql = { version = "7.0", features = ["chrono"] }
async-graphql-axum = "7.0"
tonic = "0.12"
prost = "0.13"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database
sea-orm = { version = "1", features = ["runtime-tokio-rustls", "sqlx-sqlite", "macros"] }
sea-orm-migration = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# CLI
clap = { version = "4", features = ["derive"] }

# Crypto
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1"

# Typed work-graph primitive — the fleet-standard shigoto Dag of Jobs
# (SHIGOTO.md). The layers-stay-warm Viggy loop expresses its warm STEP
# as a shigoto::Dag of typed re-warm Jobs rather than a bare loop, so the
# ordering/topology is a typed value, not ad-hoc control flow. Published
# on crates.io; pulled by digest via the workspace lock.
shigoto-dag = "0.1.12"
shigoto-types = "0.1.12"
# The in-process runtime — `InProcessScheduler` drives a `Dag` of typed Jobs to
# terminal, one wave per tick. canteiro M1 (CANTEIRO.md §5) registers each
# `CiNode` as a Job and ticks its decomposed DAG in-process; this is the
# node→worker execution half M0 deliberately deferred.
shigoto-scheduler = "0.1.12"

# Directories
dirs-next = "2"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP client (for binary cache, fetchers)
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }

# Git operations (pure Rust, no C dependencies) — published version
# on crates.io.  Upstream gix has caught up with the edition-2024
# fixes the pleme-io fork ported, so we no longer need the fork.
gix = { version = "0.83", default-features = false, features = [
    "sha1",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "worktree-mutation",
    "revision",
    "tree-editor",
] }

# Synchronous HTTP client (no tokio runtime — safe for nested blocking calls)
ureq = "3"

# Archive extraction (for fetchTarball)
flate2 = "1"
tar = "0.4"

# NATS (build agent mode)
async-nats = "0.50"

# Streaming
tokio-stream = "0.1"
futures-core = "0.3"

# Nix parsing (battle-tested MIT libraries)
rnix = "0.14"
rowan = "0.16"
nix-nar = "0.3"

# Stack growth (prevents stack overflow on deep nixpkgs fixpoints)
stacker = "0.1"

# Persistent data structures
im-rc = "15"
smallvec = { version = "1", features = ["union"] }
smol_str = "0.3"

# Performance
rustc-hash = "2"
mimalloc = { version = "0.1", default-features = false }
aho-corasick = "1"
base64 = "0.22"
data-encoding = "2"
redb = "2"
regex = "1"
toml = "0.8"

# Zero-copy archive format (L1). Wire format frozen on 0.8.x (Sep 2024),
# stable for the lifetime of the 0.8 series. mmap-and-cast reads (~20 ns
# deserialize), deterministic bytes → stable BLAKE3 content addressing.
# Validation via `bytecheck` is on for substituter-pulled archives;
# skipped for locally-written ones whose BLAKE3 was just verified.
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "alloc"] }
bytecheck = "0.8"

# Persistent functional structures for the bytecode VM (L3 env).
# imbl = bodil/im fork, Arc-backed HAMT + RRB-Vector, Send+Sync out
# of the box — mandatory for Rayon worker fanout. bodil/im is
# unmaintained; rpds is slower on the attrset-merge-heavy workload.
imbl = "5"

# Daemon hot cache — bounded LRU keyed by `GraphHash`. Used by
# graph_server to keep N most-recently-touched blobs hot in RAM so
# repeat lookups bypass the mmap path.
lru = "0.16"

# Cheap byte ownership for daemon ↔ codec ↔ store handoff.
bytes = "1"

# Testing
proptest = "1"
tempfile = "3"
pretty_assertions = "1"
test-case = "3"
assert_matches = "1"
assert_cmd = "2"
predicates = "3"
criterion = "0.5"

[package]
# crates.io publish name is `pleme-io-sui`: the bare `sui` name is held on crates.io
# by an unrelated crate (owner `huitseeker` / the Sui blockchain), so it is
# permanently unavailable to us. The org AUTO-RELEASE name-conflict convention
# ("rename to pleme-io-<original>"). The LIB and BIN names both stay `sui` (see
# [lib] + [[bin]] below), so `use sui::` (src/main.rs) and the installed binary
# name are unchanged — only the crates.io package identity is pleme-io-sui.
name = "pleme-io-sui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust-native Nix replacement (粋 sui) — drop-in nix CLI with lazy evaluator, bytecode VM, sandboxed builder, content-addressed eval cache, and NATS-federated build agent"
keywords = ["nix", "package-manager", "build-system", "evaluator"]
categories = ["command-line-utilities", "development-tools::build-utils"]
readme = "README.md"

# Keep the import name `sui` (src/main.rs does `use sui::…`) regardless of the
# crates.io package name.
[lib]
name = "sui"
path = "src/lib.rs"

[[bin]]
name = "sui"
path = "src/main.rs"

[dependencies]
gen-nix.workspace = true
sui-bytecode.workspace = true
sui-cache.workspace = true
sui-compat.workspace = true
sui-store.workspace = true
sui-eval.workspace = true
sui-ir.workspace = true
sui-build.workspace = true
sui-daemon.workspace = true
sui-intern.workspace = true
sui-orchestrate.workspace = true
sui-spec.workspace = true
# The typed shikumi config schema for /super-cache-ci + its pure
# `SuperCacheCiConfig::to_backend_config` translation. `cache serve
# --backend-config` reads this to config-select the tiered backend instead of
# the hard-coded disk path.
sui-supercacheci.workspace = true
tokio.workspace = true
axum.workspace = true
async-graphql.workspace = true
async-graphql-axum.workspace = true
tonic.workspace = true
prost.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
async-nats.workspace = true
tokio-stream.workspace = true
futures-core.workspace = true
mimalloc.workspace = true
base64.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
rand = "0.8"
url = "2"
ureq = "3"
regex.workspace = true
# Parse the operator's `cache serve --backend-config <file.toml>` /
# `--supercache-config <file.toml>` into a typed config (never a stringly path).
toml.workspace = true
# Heap-allocation profiler — keeper diagnostic, gated behind the `dhat-heap`
# feature. Under that feature it REPLACES the mimalloc global allocator (see
# src/main.rs) and writes a `dhat-heap.json` at exit whose at-t-gmax snapshot
# gives per-call-stack bytes/blocks at eval peak. Answers "which representation
# dominates the heap" (attrset FxHashMap vs thunks vs env-maps vs strings vs
# value spines) with hard bytes, not intuition. Never in a release build.
dhat = { version = "0.3", optional = true }

[features]
# The `sui` binary IS the super-cache / cache-serve daemon, so its default build
# turns ON the sui-cache/sui-store production transports (Redis L1 + Postgres L2).
# Without them `cache serve` with a tiered/redis/pg config returns
# CacheError::NotImplemented (never a silent disk fallback) — so a default-built
# image could NOT serve the TieredBackend. `default = ["tiered"]` compiles the
# Redis + Postgres arms into the shipped binary + the dockerTools image (which is
# gen/lockfile-builder-built from cargo's DEFAULT feature resolution — there is no
# `--features` hook on that path, so the tiered arms MUST be default to reach the
# image). Scoped to the root binary only: sui-cache/sui-store keep `default = []`
# so library consumers stay lean and pull zero redis/sqlx surface.
default = ["tiered"]
# Enable the Postgres L2 durable transport (cache backend + durable Store).
postgres = ["sui-cache/postgres", "sui-store/postgres"]
# Enable the Redis L1 hot-cache transport.
redis-client = ["sui-cache/redis-client"]
# The full super-cache-ci posture: Redis L1 + Postgres L2 tiered backend.
tiered = ["postgres", "redis-client"]
# Heap-allocation profiling (keeper diagnostic). Swaps the mimalloc global
# allocator for dhat::Alloc and installs a profiler guard in main so a run
# writes `dhat-heap.json`. Exactly one global allocator is active — the
# mimalloc `#[global_allocator]` in src/main.rs is `#[cfg(not(feature =
# "dhat-heap"))]`, the dhat one is `#[cfg(feature = "dhat-heap")]`. Never
# combine with a release/shipping build.
dhat-heap = ["dep:dhat"]

[dev-dependencies]
async-trait.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
serde_json.workspace = true
http-body-util = "0.1"
tower.workspace = true
tokio = { workspace = true, features = ["test-util"] }
sui-eval.workspace = true
sui-build.workspace = true
sui-store.workspace = true
sui-compat.workspace = true
tempfile.workspace = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Perf-work profile: identical codegen to release, symbols kept.
#
# `strip = true` on release is why the 2026-07-21 live-sample of the cid
# marquee eval came back as bare `??? (in sui) + 0x…` frames — atos had
# nothing to resolve against, and the 61%-in-__getattrlist root had to be
# pinned from the libc side (realpath) plus source archaeology instead of one
# symbol name. Build with `cargo build --profile release-profiling --bin sui`
# whenever a run will be sampled (`/usr/bin/sample`, Instruments, dhat);
# codegen flags match release exactly, so the numbers transfer.
[profile.release-profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

[lints.clippy]
pedantic = "warn"

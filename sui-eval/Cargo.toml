[package]
name = "sui-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Clean-room Nix language evaluator — lazy tree-walker + bytecode VM with construction-guaranteed Lazy<T>"
keywords = ["nix", "evaluator", "lazy", "tree-walker", "vm"]
categories = ["compilers", "parser-implementations"]

[dependencies]
# okiba (置き場) — XDG resolution where a RELATIVE override is IGNORED per spec.
# Four cache/config paths in this crate checked only !is_empty(), never
# is_absolute() — the partial-guard shape, which reads as finished. Used here
# for the one that maps onto a tier exactly; the other three keep inline
# filters because their fallbacks (~/Library/Caches on macOS, an exists/create
# dance) are not what okiba resolves to.
okiba = "0.3"
sui-bytecode.workspace = true
sui-compat.workspace = true
sui-intern.workspace = true
# ENV-RESOLVE M0 — parse-time variable-resolution side-table. Behind the
# `SUI_RESOLVE=1` env flag (default off); the `Lexical` fast path skips the
# per-lookup re-intern on the tree-walker's hot Ident arm. Parity by
# construction — see `sui-resolve`'s crate docs + `docs/ENV-RESOLVE-DESIGN.md`.
sui-resolve.workspace = true
sui-normalize.workspace = true
sui-store.workspace = true
sui-spec.workspace = true
# L1 substrate — optional cross-process / fleet-shared eval-cache tier.
# Existing in-memory + JSON-file tiers are preserved; GraphStore tier
# stacks on top, selected via `EvalCache::with_graph_store` or
# `with_all_tiers`. See `eval_cache.rs` for the tier-ordering contract.
sui-graph-store.workspace = true
rnix.workspace = true
rowan.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
md-5 = "0.10"
sha1 = "0.10"
redb.workspace = true
sha3.workspace = true
blake3.workspace = true
serde_yaml_ng.workspace = true
regex.workspace = true
toml.workspace = true
base64.workspace = true
data-encoding.workspace = true
thiserror.workspace = true
tracing.workspace = true
ureq.workspace = true
gix.workspace = true
flate2.workspace = true
tar.workspace = true
stacker.workspace = true
im-rc.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
smol_str.workspace = true
# Census RSS-poll (mach_task_basic_info on macOS; /proc/self/statm elsewhere).
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true
test-case.workspace = true
proptest.workspace = true
criterion.workspace = true
# tatara-lisp for Lisp-authored Nix test corpus + oracle testing.
# Version dep against crates.io — keeps `cargo metadata` clean in
# environments (CI, fresh checkout) where the sibling repo isn't laid out
# next to sui on disk. The derive macros come in through this one crate as
# `tatara_lisp::DeriveTataraDomain`; naming `tatara-lisp-derive` here would
# reintroduce the lib/derive skew (see the workspace root's note).
tatara-lisp.workspace = true
rand = "0.8"
rand_chacha = "0.3"

[[bench]]
name = "eval"
harness = false

[[test]]
name = "oracle"
path = "tests/oracle.rs"

[lints]
workspace = true

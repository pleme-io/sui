# clippy-gate — the DENY-TIER lint box.
#
# Before this workflow, `git grep -n "clippy\|cargo fmt" -- .github/` returned
# ZERO: no workflow in this repo ran either. Meanwhile Cargo.toml sets
# `[workspace.lints.clippy] pedantic = "warn"` across the workspace, whose own
# comment says "warn-level (never a hard build break)". So the repo's lint
# posture read as a gate in a diff and enforced nothing.
#
# ── why this gate is not `-D warnings` ───────────────────────────────────
# Measured 2026-08-17, `cargo clippy -p sui-eval`, eight crates:
#
#     sui-eval 622   sui-spec 308   sui-bytecode 283   sui-compat 120
#     sui-store  97   sui-graph-store 32   sui-resolve 9   sui-intern 4
#                                                        (1475 total)
#
# A `-D warnings` gate lands red on 1475 warnings, and a gate that is red on
# arrival gets switched off within the week. So it is not the ratchet.
#
# What IS gated is the tier that is already `deny` BY DEFAULT — the
# `clippy::correctness` group. Those are errors, not warnings, so a bare
# `cargo clippy` exits 101 on them with no `-D` flag anywhere. Two consequences
# worth stating because they are the whole design:
#
#   1. The permitted count is ZERO OVER THE SCANNED TARGETS, so there is no
#      baseline number to maintain and no "the count went down" bookkeeping. A
#      warning-count ratchet is satisfiable by DELETING code; zero is not.
#
#      ★ NOT "zero by construction" — that phrasing was here and it was false.
#      It is zero by TARGET SELECTION. `--all-targets` is excluded, and the
#      baseline file records exactly why: 14 deny-tier `clippy::approx_constant`
#      errors live in sui-eval's TEST targets. A gate configured to skip the
#      targets where it is known-red does not have a zero permitted count; it
#      has 14 permitted deny-tier violations, indefinitely, and saying otherwise
#      rounds the tier up.
#
#      Those 14 are the honest next step for this gate, not a footnote:
#      pending-clippy-gate: 14 approx_constant in sui-eval test targets, then
#      --all-targets.
#   2. The 1475 pedantic warnings stay warnings and never block a merge, so
#      the gate is green on arrival without anyone burning down a backlog
#      first. Pedantic can tighten later, on its own schedule, without
#      touching this file.
#
# This gate found and this branch fixed one real instance:
# `clippy::absurd_extreme_comparisons` at sui-eval/src/eval.rs:374, where a
# `usize::MAX` sentinel for "no depth limit" made `depth > MAX_EVAL_DEPTH`
# always-false in non-test builds. Fixed by typing the bound `Option<usize>`,
# which removes the comparison from the non-test build entirely rather than
# guarding it.
#
# ── anti-vacuity ─────────────────────────────────────────────────────────
# The floor step runs BEFORE clippy, deliberately. A floor checked after the
# thing it is supposed to bound lets an emptied set report green on the way
# past. Exit code 3 is the fleet's "the SCAN ITSELF is broken" code (see
# `require-scanned!` in pleme-io/actions/_tlisp-stdlib), which is a different
# verdict from 1 ("violations found") and must not share its code.
#
# The crate list itself is the other half of the denominator, and it is
# enforced by cargo rather than by this workflow: `clippy-gate` names every
# package explicitly, so a renamed or dropped crate produces `package ID
# specification ... did not match any packages` and fails. That is not
# hypothetical here — four workflows in this repo passed `-p sui` after the
# crate was renamed to `pleme-io-sui` in 5f76b39 and were silently broken for
# months (see the header of perf-seal.yml).
#
# ── scope, stated rather than implied ────────────────────────────────────
# 8 of 31 packages (25.8%), default targets only (no `--all-targets`). The
# other 23 packages and the `--all-targets` debt are itemised, with the
# measurement missing for each, in clippy-gate-baseline.txt. That file may
# only shrink.
#
# ── not in this change ───────────────────────────────────────────────────
# `cargo fmt --check` is deliberately absent: the repo is not rustfmt-clean at
# baseline (~100 files would move), so folding it in here would make this gate
# red on arrival for a reason unrelated to lints — and would put a ~100-file
# reformat inside the same commit that introduces a lint gate. It is a
# separate change, and it needs its own commit so the reformat is reviewable
# as a reformat.
#
# ── shape ────────────────────────────────────────────────────────────────
# Hand-authored rather than a `(defpipeline …)` over pleme-io/actions, for the
# reason runtime-install-lint.yml's header already gives: a pipeline names
# ACTIONS, and there is no action to name here. `pleme-io/actions/rust-gate`
# is the near-miss and was rejected on measurement, not taste — its clippy
# invocation is hardcoded `clippy --all-targets -- -D warnings` (run.tlisp:61)
# with no argument input, so it is unusable by any repo carrying a pedantic
# backlog, which is most of them. Extending it with a `clippy-args` input is
# the load-bearing fix and the destination for this file; it is not done here
# because it is a change to another repo that this branch cannot verify.
name: clippy-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  clippy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `components: clippy` is load-bearing, not decoration. dtolnay's action
      # installs the MINIMAL profile, which ships rustc/cargo/rust-std and no
      # clippy — and the ambient toolchain on the fleet's darwin workstations
      # has none either (`cargo clippy` there: "error: no such command:
      # clippy", measured 2026-08-17). Drop this line and the gate does not
      # degrade quietly; `cargo clippy-gate` fails outright, which is the
      # correct direction for a missing scanner.
      - name: Install Rust toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # ANTI-VACUITY FLOOR — runs before clippy, on purpose.
      #
      # ★ THIS FLOOR COUNTED LINES, NOT CRATES, AND WAS THEREFORE VACUOUS.
      # It was `grep -c '^  "-p", "' .cargo/config.toml`. Replace the eight
      # entries with eight copies of one crate and: grep returns 8, the floor
      # passes, cargo dedups the specs without complaint, and coverage collapses
      # from ~126k lines across 8 crates to sui-intern's 1,012. Exit 0.
      # Reproduced before fixing. Ordering was never the problem — the floor ran
      # first and still could not see an emptied set, because it bounded the
      # wrong quantity.
      #
      # Now: DISTINCT crate names, each verified to exist in the workspace. A
      # duplicate no longer counts twice and a typo is a broken scan rather than
      # a silently narrower one.
      #
      # ★ AND IT MUST NOT DIE UNDER `bash -e`. GitHub runs `run:` with `-e`, so
      # a bare `n=$(grep …)` ABORTS the step the moment grep matches nothing —
      # before any echo, with grep's own status. Measured: a missing config file
      # exited 2, and a deleted alias exited 1, which is the code this gate
      # reserves for "violations found". The two most complete forms of "the
      # scan is broken" reported the one thing the header forbids. Every
      # command that may legitimately find nothing is now `|| true`-guarded so
      # the script reaches its own typed exit.
      # ★ THE LOGIC LIVES IN tools/clippy-gate-floor.tlisp, NOT HERE.
      #
      # This step was 21 lines of `sed`/`grep -c`/`for`/`if` in a `run: |`
      # block — real logic (parse, dedupe, count, resolve, branch, typed exit)
      # wearing YAML. The fleet's NO SHELL rule covers it exactly, and it is
      # the shape the rule is easiest to lose to: authoring a .sh file feels
      # like writing a script, so the rule fires; embedding the same program in
      # a workflow feels like writing configuration, so it does not.
      #
      # What the move bought, beyond compliance:
      #   - `tatara-script lint` catches an invented primitive. It caught three
      #     while this was being written.
      #   - 5 `deftest` cases now cover the predicates the shell encoded —
      #     including the duplicate-collapse case that IS the bug the shell
      #     shipped with. Embedded shell cannot be unit-tested at all.
      #   - it runs locally with no job environment to reconstruct, which is
      #     how all four broken-scan shapes were proven before landing.
      #
      # `script-file:`, never inline `script:` — GitHub echoes every env value
      # into the step log, and an inline body would dump the whole program
      # there, so any later grep for a message matches the line that WOULD
      # print it rather than one that did.
      #
      # runs-on is ubuntu-latest (24.04), clearing tatara-script's glibc 2.39
      # floor. Do not lower this job to 22.04 without switching to a musl
      # build; the binary will not execute there.
      - name: Floor the gated crate set
        uses: pleme-io/actions/tatara-script@a379425dce28501430be1ab6bdc5f394d6a7cefc
        with:
          script-file: tools/clippy-gate-floor.tlisp

      # Deny-tier only. No `-D warnings`: see the header.
      # The crate list lives in .cargo/config.toml so this line cannot drift
      # from what the floor above counted.
      #
      # ★ REPORT-ONLY ON ARRIVAL, and this is a dated, removable state — not a
      # permanent hedge.
      #
      # "Green on arrival" was measured with nixpkgs clippy 1.91.1. This step
      # runs `dtolnay/rust-toolchain@stable`, and this machine's own store
      # already carries clippy 1.97.1 — the fleet's fenix `stable` floats there.
      # That is six minor releases of new correctness-group lints between the
      # measurement and the runtime, and none of them are measured. Worse,
      # `cargo clippy` is not installable in the active toolchain here at all
      # ("error: no such command: clippy"), so the gap CANNOT be closed from
      # this workstation.
      #
      # Landing it blocking would mean shipping an unverified red risk into a
      # gate every push depends on. That exact move was made earlier today —
      # a flag contract refused `--impure`, sui's own parity corpus uses it, and
      # `parity.yml` was red for six consecutive runs before anyone noticed.
      #
      # REMOVAL CONDITION, so this does not quietly become permanent: after ONE
      # green run of this job on CI, delete `continue-on-error` in the same
      # commit that cites the run URL. A report-only gate enforces nothing, and
      # this repo has an entire audit trail about surfaces that declare more
      # than they enforce — this line is on that list until it comes off.
      #   pending-clippy-gate: report-only until one green CI run
      - name: Deny-tier clippy over the gated crate set
        continue-on-error: true
        run: cargo clippy-gate

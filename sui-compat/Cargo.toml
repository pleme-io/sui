[package]
name = "sui-compat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Clean-room Nix format and protocol compatibility layer (NAR, store paths, ATerm, derivations)"
keywords = ["nix", "nar", "store-path", "aterm", "derivation"]
categories = ["parser-implementations", "encoding"]

[dependencies]
ed25519-dalek.workspace = true
# SecretKey::generate needs a CSPRNG; same pin sui-cache uses.
rand_core = { version = "0.6", features = ["getrandom"] }
sha2.workspace = true
sha1 = "0.10"
md-5 = "0.10"
nix-nar.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
memchr = "2"
xz2 = "0.1"
zstd = "0.13"

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
criterion.workspace = true

[[bench]]
name = "store_path"
harness = false

[[bench]]
name = "nar"
harness = false

[lints]
workspace = true

[package]
name = "sui-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Built-in binary cache server and push pipeline for the sui Rust-native Nix runtime"
keywords = ["nix", "binary-cache", "cache", "store"]
categories = ["caching", "web-programming::http-server"]

[dependencies]
sui-compat.workspace = true
# The shared content-addressed store backends (StorageBackend trait +
# Local/S3/Redis/Pg/Tiered impls). sui-cache is a cache SERVER; it re-exports
# sui-castore's store surface for backward-compatibility while building the
# HTTP push/serve layer on top.
sui-castore.workspace = true
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
xz2 = "0.1"
# zstd: the default NAR codec since 2026-08-05 — 19x faster than xz -6 on a
# measured 48 MB NAR. Version matches sui-store, which already vendors it.
zstd = { version = "0.13", features = ["zstdmt"] }  # zstdmt: multithreaded encoder
# The fleet config primitive (★★ CONFIGURATION MANAGEMENT). `CacheConfig` is a
# `shikumi::TieredConfig`, so the NAR codec + level are a deployment knob
# (env-selected tier / YAML overlay) rather than a recompile. Same version the
# rest of the workspace already resolves.
shikumi = "0.1"
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = { workspace = true }
async-trait = { workspace = true }
bytes = "1"

[features]
default = []
# Enable the production Redis transport — forwards to sui-castore's feature.
redis-client = ["sui-castore/redis-client"]
# Enable the production Postgres L2 transport — forwards to sui-castore's feature.
postgres = ["sui-castore/postgres"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
reqwest = { workspace = true }
tower = { workspace = true }
http-body-util = "0.1"
# Test-only: the NAR memory gate generates a 256 MiB NAR as a `Stream` rather
# than a buffer (materializing it would swamp the very peak being measured).
# The production code needs no `futures` — `spool_or_buffer` is generic over the
# transport's own stream error, so the axum body goes straight through.
futures = "0.3"

[lints.clippy]
pedantic = "warn"

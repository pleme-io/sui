# Byte-parity regression box — the CORRECTNESS half of the sui↔nix seal.
#
# `sui parity` runs the eval-shape corpus and diffs each sui-computed drvPath /
# hash / NAR byte-for-byte against the real `nix` binary. A shape whose sui
# output diverges from nix fails this job — "a drvPath changed" is now a red CI
# check, not a silent drift caught only when an operator remembers to run it.
#
# This is the sibling gate to `perf-seal.yml`:
#   - perf-seal.yml  → SPEED   (deterministic eval_expr op-count budget, no nix)
#   - parity.yml     → BYTE     (sui drvPath == nix drvPath, needs nix)
# Together they box both axes: eval may not get slower AND may not change a byte.
#
# Unlike perf-seal (in-process, nix-free), this job installs `nix` because the
# gate IS the sui-vs-nix differential. Linux-runner probes render
# `builtins.currentSystem` = x86_64-linux and compare against nix's x86_64-linux
# output; darwin-only rows are not exercised here (that needs a macOS runner —
# a named follow-up, see docs/EVAL-PERF-SEAL.md).
#
# ── FIXED 2026-08-04: the package spec was stale and this job could not pass.
# `-p sui` names no package; the crate was renamed to `pleme-io-sui` in 5f76b39
# ("bare 'sui' is squatted upstream") and this workflow was never updated, so
# every run failed with `package ID specification 'sui' did not match any
# packages`. The [[bin]] is still `sui` — only the PACKAGE moved, which is why
# `--bin sui` stayed correct and the line read fine at a glance.
name: parity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The byte gate needs the real nix binary to diff against.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build sui
        run: cargo build -p pleme-io-sui --bin sui

      # The provable box: exits non-zero on any drvPath/hash/NAR byte-divergence
      # from nix, or any unexpected regression of a previously-matching row.
      # A row that can't run on this platform is reported Skipped, not failed —
      # a nix-present linux runner still enforces the x86_64-linux corpus.
      - name: Run byte-parity gate
        # This runner has NO pinned nixpkgs oracle: it resolves impure <nixpkgs>
        # to a different rev than the corpus was byte-closed against, so the ~35
        # ecosystem rows (hello/stdenv/… + the darwin currentSystem seeds) cannot
        # evaluate here. SUI_PARITY_PUREONLY reclassifies those could-not-evaluate
        # rows (SuiError, NEVER Diverge) as Skipped, so this gate BLOCKS on the ~40
        # environment-independent rows (hash/derivation/context/attrset algebra) —
        # a real byte-divergence there is a red gate. A wrong-byte (Diverge) still
        # fails even here; only unevaluable rows skip. The FULL corpus is proven on
        # the operator machine + the pinned-oracle big-mem job (the destination:
        # a flake-locked oracle + per-row EnvCapability). A seal is only real if
        # its oracle is reproducible where enforced.
        env:
          SUI_PARITY_PUREONLY: "1"
        run: ./target/debug/sui parity

      # ── ★ THE WHOLE SUITE, NOT ONE TEST FILE ────────────────────────────
      # This step used to be `cargo test -p pleme-io-sui --test
      # eval_cache_wiring` — 8 tests, and it was the ONLY `cargo test` any
      # workflow ran on a push. Measured 2026-08-17: the repo has ~5,716
      # passing tests, so **1.2% of the suite gated every commit** and the
      # other 98.8% was written, maintained, and never run outside an
      # operator's terminal. `cargo test --workspace` appeared in zero
      # workflows.
      #
      # That is the single cheapest correctness change available to this
      # repo, and it is one line.
      #
      # It could not be turned on honestly until today, because the suite was
      # FLAKY: three process-global races (a NIX_PATH pair, the perf counters,
      # and a HOME override + shared scratch path fixed alongside) made a full
      # run fail roughly 1 in 2. A gate that goes red at random gets ignored
      # and then deleted, so the races were fixed first and the suite measured
      # stable over repeated full runs before this line changed. Do not relax
      # this step to `--no-fail-fast || true` or to a subset if it goes red —
      # a red here is the gate working.
      #
      # eval_cache_wiring is still covered; it is simply part of the workspace
      # now rather than the only thing running.
      - name: Run the test suite
        run: cargo test --workspace

      # NOT YET ENABLED, and named so it is not forgotten: this runner installs
      # nix (three steps up) and then never uses it for the differentials.
      # `SUI_TEST_ONLINE` is set by NO workflow, so 67 `skip_if_offline()` call
      # sites across 20 files silently pass, and four declared sui-vs-nix gates
      # (cli_parity, build_parity, full_build, real_nix_client) report `ok`
      # while no-opping. Measured: the prebuilt `cli_parity` binary runs 10
      # declared differentials in 0.00s with zero nix invocations and reports
      # `ok` — not `ignored`. That is pure recovered coverage sitting one env
      # var away, but those tests have never run in CI, so flipping it blind
      # would turn this gate red for reasons unrelated to the commit that
      # flips it. It wants its own change, run locally first.
      #   pending-ci: SUI_TEST_ONLINE=1

name: canteiro-crux
on:
  workflow_dispatch: {}
jobs:
  build:
    name: canteiro · build
    runs-on: ${{ vars.PRIVATE_BUILDER_RUNNER || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v4
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        github-token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
        determinate: false
        extra-conf: |
          experimental-features = nix-command flakes
          accept-flake-config = true
          sandbox = relaxed
          access-tokens = github.com=${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
    - name: Run build
      run: |
        # Proven build env (see canteiro-m1.yml): cargo/rustc/gcc from nixpkgs.
        # No system C library: the workspace links none (tests/no_c_tls.rs).
        nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#gcc \
          --command \
            cargo build -p sui-supercacheci
  test:
    name: canteiro · test
    runs-on: ${{ vars.PRIVATE_BUILDER_RUNNER || 'ubuntu-latest' }}
    needs:
    - build

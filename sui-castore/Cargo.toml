[package]
name = "sui-castore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Content-addressed store backends for sui: the StorageBackend trait + Local/S3/Redis/Pg/Tiered implementations shared by sui-cache and sui-registry"
keywords = ["nix", "nar", "store", "content-addressed", "cache"]
categories = ["caching", "filesystem"]

[dependencies]
sui-compat.workspace = true
tokio.workspace = true
serde.workspace = true
schemars.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
bytes = "1"
futures = "0.3"
object_store = { version = "0.12", features = ["aws"] }
redb.workspace = true
sha2.workspace = true

[dependencies.redis]
version = "0.27"
default-features = false
features = ["tokio-comp", "connection-manager"]
optional = true

[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio-rustls", "postgres"]
optional = true

[features]
default = []
redis-client = ["dep:redis"]
postgres = ["dep:sqlx"]
# `AdmittedNarInfo::unchecked_fixture`, for other crates' tests of storage
# mechanics. Enable it only from [dev-dependencies]; a production build that
# turned it on could store an unadmitted narinfo.
test-fixtures = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile.workspace = true
serde_json.workspace = true
xz2 = "0.1"
zstd = "0.13"

[lints.clippy]
pedantic = "warn"

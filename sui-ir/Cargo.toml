[package]
name = "sui-ir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "L3 lower-once flat IR for the sui evaluator — per source file one Program { exprs, spans } with ExprId(u32) indices, lowered from the rnix/rowan AST exactly once (docs/SPEED.md L3)"
keywords = ["nix", "evaluator", "ir", "lowering", "compilers"]
categories = ["compilers", "parser-implementations"]

[dependencies]
sui-intern.workspace = true
rnix.workspace = true
rowan.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
# `builtins.{split,match}` mirror the tree-walker's regex-backed
# implementation — same crate, same semantics, differential-gated.
regex.workspace = true
# `builtins.toJSON`/`fromJSON` build/parse the SAME serde_json::Value the
# walker does, so JSON byte-format cannot drift from the oracle.
serde_json.workspace = true
# The version algorithms (`compareVersions`/`parseDrvName`/`splitVersion`)
# and the CppNix float format are the SAME typed impls the tree-walker uses
# (`sui_compat::versions`). Promoted from a dev-dep to a real dep so the
# builtins bridge shares them by construction. sui-compat has no pleme-io
# deps, so no cycle; nothing depends on sui-ir.
sui-compat.workspace = true
# `derivation`/`derivationStrict` route their input-addressed drvPath +
# output-path computation through the SAME Lisp-authored spec interpreter the
# tree-walker uses (`sui_spec::derivation::apply` over `sui-spec/specs/
# derivation.lisp`), so the ATerm serialization + store-path hashing cannot
# drift from the oracle — the drvPath is byte-identical by construction, not by
# a re-implemented "cleaner" scheme. sui-spec depends on sui-compat (already
# ours) and NOT on sui-ir, so no cycle.
sui-spec.workspace = true
# `builtins.hashString` mirrors the walker's md5/sha1/sha256/sha512 digest →
# lowercase-hex, using the SAME crates the tree-walker uses (sui-eval's
# strings.rs). sha2 is a workspace dep; md-5 / sha1 match sui-eval's exact
# versions so the digest bytes cannot drift.
sha2.workspace = true
md-5 = "0.10"
sha1 = "0.10"

[dev-dependencies]
proptest.workspace = true
# The eval differential (tests/eval_differential.rs) drives BOTH engines:
# the tree-walker (sui-eval, the semantic oracle) and eval_ir, and
# byte-compares their rendered results. Dev-only — the sui-ir library
# itself never links the live engines.
sui-eval.workspace = true
# The parity corpus generator (src/parity_corpus.rs, lifted verbatim via
# #[path] in tests/differential.rs) builds its rows from the canonical typed
# Nix AST — same crate the root workspace uses.
gen-nix.workspace = true

[lints.clippy]
pedantic = "warn"

# runtime-install-lint — CI-gate per-job Nix installation in sui's OWN workflows
# (theory/NIX-HARDENING.md §VI, §VI.1). The `pleme-io/actions/runtime-install-lint`
# tool scans `.github/workflows/*.yml` for a per-job nix-installer
# (DeterminateSystems/nix-installer-action or `nix shell nixpkgs#…`) — the CI
# build env belongs BAKED into the runner image, not installed on every job.
#
# The 4 workflows that install Nix per-job today (canteiro-m1, canteiro-crux,
# parity, nixpkgs-parity-track) are grandfathered as tracked debt in
# .github/workflows/runtime-install-baseline.txt; they graduate to zero as they
# migrate onto the baked hardened-actions-runner image (pleme-io/hardened-images
# `actionsRunner`, commit 6564f47). A NEW workflow adding a per-job nix-installer
# is NOT baselined → this check FAILS. Read-only scan; ubuntu-latest, matching
# sui's other light jobs (parity / perf-seal).
#
# Expressed as a DECLARED PIPELINE of pleme-io actions rather than a
# hand-authored step list — sui is the second consumer of substrate's
# action-pipeline.yml, after escriba.
#
# This one converts cleanly because the work IS a pleme-io action. sui's other
# six workflows do NOT and are deliberately left alone: they run sui's OWN
# binary (`./target/debug/sui parity`, `sui perf-seal`, the canteiro checks),
# and a pipeline names actions — there is no action to name. That is the real
# boundary of this mechanism, worth stating rather than discovering later.
#
# The conversion also found a bug in the action it calls: the pipeline run
# reproduced the direct run EXACTLY, including `files-scanned=0` against sui's
# 9 workflow files, which is how the 0 was attributable to the action rather
# than to this change. Fixed in pleme-io/actions@632fe32; sui now reports 9.
name: runtime-install-lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    uses: pleme-io/substrate/.github/workflows/action-pipeline.yml@main
    with:
      pipeline: |
        (defpipeline runtime-install-lint
          (step runtime-install-lint :baseline-path ".github/workflows/runtime-install-baseline.txt")
        )
    secrets: inherit

[package]
name = "sui-supercacheci"
description = "Typed shikumi config schema for /super-cache-ci — service-level sui (Postgres store, Redis cache, RAM/tmpfs build sandbox) as the never-touch-durable-disk convergence. Schema + tier model only; backend + daemon wiring are named LiveTODOs."
keywords = ["nix", "sui", "cache", "shikumi", "config"]
categories = ["config", "development-tools::build-utils"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# canteiro M1 live-proof entrypoint (theory/CANTEIRO.md §5). The in-pod binary
# that constructs a 2-node CiRun and drives it through `run_in_process` on a
# real camelot ARC worker. The library stays a plain `async fn`; only this bin
# needs a runtime, hence the real (non-dev) tokio dep below.
[[bin]]
name = "canteiro-run"
path = "src/bin/canteiro-run.rs"

# canteiro plane-(a) emitter (theory/CANTEIRO.md §5 crux). Builds the real
# 2-node sui CiRun (cargo build -> cargo test) and writes its DAG-derived GitHub
# Actions job graph to .github/workflows/canteiro-crux.yml (persisted-spec
# discipline: the committed workflow IS this binary's output).
[[bin]]
name = "canteiro-emit-gha"
path = "src/bin/canteiro-emit-gha.rs"

# canteiro plane-(b) CROSS-PROCESS worker (theory/CANTEIRO.md §7.1-A). The in-pod
# binary one camelot-eks ARC pod runs: claim a WorkItem from the Postgres
# `PgWorkQueue` -> run it via SubprocessRunner -> report the NodeResult back
# through PG -> repeat until close. Needs the `postgres` feature for the real
# SqlxPgQueueConn (a `postgres`-less build compiles a stub main); build with
# `cargo build -p sui-supercacheci --features postgres --bin canteiro-worker`.
[[bin]]
name = "canteiro-worker"
path = "src/bin/canteiro-worker.rs"

[dependencies]
# Fleet-standard tiered config surface (default <- discovered <- override,
# hot-reload). SuperCacheCiConfig impls shikumi::TieredConfig so /super-cache-ci
# is configured exactly like every other operator-facing pleme-io tool.
shikumi = "0.1"
serde.workspace = true
# canteiro's shared CI-run types + DAG algebra (CANTEIRO §7.1-C), extracted so a
# caixa `:kind Acao` renderer can consume a typed CiRun. sui-supercacheci owns
# the EXECUTION half (CiNodeJob/run_in_process/run_distributed/emitters) and
# re-exports this crate from `canteiro` so every existing consumer is unchanged.
canteiro-types.workspace = true

# canteiro M0 (theory/CANTEIRO.md §5): a CI run decomposes into ONE typed
# content-addressed DAG. The shipped, pure shigoto primitives are the decompose
# target -- `Dag` (monomorphic over `JobId`) + the `Job` trait a `CiNode`
# implements. Same workspace deps sui-orchestrate / sui-dockerfile-prewarmer
# already use; the scheduler (in-process wave execution) is the M1 deployment
# half and is deliberately NOT pulled here.
shigoto-dag.workspace = true
shigoto-types.workspace = true

# canteiro M1 (CANTEIRO.md §5): in-process wave execution. A CiNode is a shigoto
# `RecordingJob`; `run_in_process` registers each node into an
# `InProcessScheduler` and ticks the decomposed `Dag` to terminal. The scheduler
# provides its own tokio runtime dependency transitively; the driver is a plain
# `async fn`, so no tokio non-dev dep is needed here.
shigoto-scheduler.workspace = true

# canteiro plane (a) — the multi-worker dispatch crux (CANTEIRO.md §5). `emit_gha`
# projects a decomposed CiRun onto a GitHub Actions job graph (one job per CiNode,
# `needs:` = the DAG edges); serde_yaml_ng is the TYPED YAML renderer (★★ TYPED
# EMISSION — no `format!()` of YAML). GitHub then schedules those jobs onto
# separate ARC workers; canteiro is the DAG source + emitter, NOT the cross-worker
# runtime scheduler.
serde_yaml_ng.workspace = true

# The freshness maintenance pass COMPOSES the real sui crates (never forks):
# sui-cache's shipped root-set GC (gc::collect_garbage) over its StorageBackend
# trait, and sui-store's durable Store GC contract (GcOptions/GcResult). The
# async CacheMaintenance environment seam uses async-trait; errors are typed via
# thiserror.
sui-cache.workspace = true
sui-store.workspace = true
async-trait.workspace = true
thiserror.workspace = true
# canteiro plane-(b) cross-process transport (canteiro_pg): the WorkQueue /
# ResultTransport trait impls log-and-degrade on a PG error (the trait methods
# return no Result), via the fleet-standard typed logging surface.
tracing.workspace = true

# `(defsupercacheci ...)` authoring surface (Rust + Lisp primary pattern).
# The workspace root already exact-pins tatara-lisp-derive to "=0.2.2" (the
# last release matching what tatara-lisp 0.2.4 actually exports) -- the
# lib/derive skew this crate's LiveTODO(lisp) note described as blocking
# was already fixed at the workspace level; this crate had just never been
# repointed at the fix.
tatara-lisp.workspace = true
tatara-lisp-derive.workspace = true
# DeriveTataraDomain's generated impl references serde_json directly.
serde_json.workspace = true

# canteiro M1: the `canteiro-run` bin blocks on the plain `async fn`
# `run_in_process`, so it needs a tokio runtime. Features: `macros` for
# `#[tokio::main]`, `rt` + `rt-multi-thread` because the shipped
# `InProcessScheduler` fans nodes out over a `tokio::task::JoinSet`, and `time`
# because the canteiro_pg cross-process claim/scheduler poll loops sleep between
# empty polls (`tokio::time::sleep` — there is no cross-process `Notify`).
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

# canteiro plane-(b) cross-process transport (canteiro_pg, `postgres` feature):
# the real SqlxPgQueueConn over a sqlx Postgres pool. Feature-gating convention
# mirrors sui-castore exactly (default off; the mock-tested state machine needs
# zero driver surface). Uses the runtime `sqlx::query()` API (no compile-time
# DATABASE_URL / offline metadata required).
[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio-rustls", "postgres"]
optional = true

[features]
default = []
# Pulls the real sqlx Postgres transport for canteiro_pg's PgWorkQueue +
# the canteiro-worker bin's SqlxPgQueueConn::connect path.
postgres = ["dep:sqlx"]

[dev-dependencies]
# Async freshness-pass tests + the in-memory sui_cache::StorageBackend double
# (proves composition of the real collect_garbage with zero disk).
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true

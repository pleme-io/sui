# Byte-parity regression box — the CORRECTNESS half of the sui↔nix seal.
#
# `sui parity` runs the eval-shape corpus and diffs each sui-computed drvPath /
# hash / NAR byte-for-byte against the real `nix` binary. A shape whose sui
# output diverges from nix fails this job — "a drvPath changed" is now a red CI
# check, not a silent drift caught only when an operator remembers to run it.
#
# This is the sibling gate to `perf-seal.yml`:
#   - perf-seal.yml  → SPEED   (deterministic eval_expr op-count budget, no nix)
#   - parity.yml     → BYTE     (sui drvPath == nix drvPath, needs nix)
# Together they box both axes: eval may not get slower AND may not change a byte.
#
# Unlike perf-seal (in-process, nix-free), this job installs `nix` because the
# gate IS the sui-vs-nix differential. Linux-runner probes render
# `builtins.currentSystem` = x86_64-linux and compare against nix's x86_64-linux
# output; darwin-only rows are not exercised here (that needs a macOS runner —
# a named follow-up, see docs/EVAL-PERF-SEAL.md).
#
# ── FIXED 2026-08-04: the package spec was stale and this job could not pass.
# `-p sui` names no package; the crate was renamed to `pleme-io-sui` in 5f76b39
# ("bare 'sui' is squatted upstream") and this workflow was never updated, so
# every run failed with `package ID specification 'sui' did not match any
# packages`. The [[bin]] is still `sui` — only the PACKAGE moved, which is why
# `--bin sui` stayed correct and the line read fine at a glance.
name: parity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The byte gate needs the real nix binary to diff against.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build sui
        run: cargo build -p pleme-io-sui --bin sui

      # The provable box: exits non-zero on any drvPath/hash/NAR byte-divergence
      # from nix, or any unexpected regression of a previously-matching row.
      # A row that can't run on this platform is reported Skipped, not failed —
      # a nix-present linux runner still enforces the x86_64-linux corpus.
      - name: Run byte-parity gate
        # This runner has NO pinned nixpkgs oracle: it resolves impure <nixpkgs>
        # to a different rev than the corpus was byte-closed against, so the ~35
        # ecosystem rows (hello/stdenv/… + the darwin currentSystem seeds) cannot
        # evaluate here. SUI_PARITY_PUREONLY reclassifies those could-not-evaluate
        # rows (SuiError, NEVER Diverge) as Skipped, so this gate BLOCKS on the 41
        # environment-independent rows (hash/derivation/context/attrset algebra) —
        # a real byte-divergence there is a red gate. A wrong-byte (Diverge) still
        # fails even here; only unevaluable rows skip. The FULL corpus is proven on
        # the operator machine + the pinned-oracle big-mem job (the destination:
        # a flake-locked oracle + per-row EnvCapability). A seal is only real if
        # its oracle is reproducible where enforced.
        #
        # ── ★ THE NARROWING IS NOW A COMPARED VALUE, AND IT HAS A FLOOR ─────
        #
        # SUI_PARITY_PUREONLY is set INLINE on the run line, not in an `env:`
        # block, because it changes what this gate enforces and that belongs in
        # the command a reviewer reads. It used to be invisible in two ways at
        # once: tucked in `env:`, and moving no number the gate read. The gate
        # exited non-zero on `unexpected > 0` and nothing else — a count of rows
        # that FAILED, which a reclassified row never does. So a run in which the
        # flag removed every single row printed `∑ 0 match · 0 regressions` and
        # exited 0: a gate that compared nothing, certifying everything.
        #
        # `sui parity` now derives a typed SweepVerdict over its Match rows and
        # reports {enforced, enforced_floor, sweep_verdict} in both the table and
        # the JSON. Two things follow:
        #   - Reclassified  the seal claim is WITHHELD ("NOT SEALED: …"). Not
        #                   fatal — this flag legitimately narrows on this
        #                   runner, and a gate that is red by construction gets
        #                   switched off.
        #   - BelowFloor    fatal. Fewer than 20 rows actually enforced under
        #                   PUREONLY (38 without it) means the gate compared too
        #                   little to make a claim, however the rows left.
        # The floor counts what REMAINS rather than what left, which is the only
        # form that also catches rows that skip THEMSELVES — measured 2026-08-17,
        # of 50 rows removed under a failing oracle only 14 were flag-reclassified
        # and 36 self-skipped, invisible to every skip budget.
        run: SUI_PARITY_PUREONLY=1 ./target/debug/sui parity

      # ── ★ THE WHOLE SUITE, NOT ONE TEST FILE ────────────────────────────
      # This step used to be `cargo test -p pleme-io-sui --test
      # eval_cache_wiring` — 8 tests, and it was the ONLY `cargo test` any
      # workflow ran on a push. Measured 2026-08-17: the repo has ~5,716
      # passing tests, so **1.2% of the suite gated every commit** and the
      # other 98.8% was written, maintained, and never run outside an
      # operator's terminal. `cargo test --workspace` appeared in zero
      # workflows.
      #
      # That is the single cheapest correctness change available to this
      # repo, and it is one line.
      #
      # It could not be turned on honestly until today, because the suite was
      # FLAKY: three process-global races (a NIX_PATH pair, the perf counters,
      # and a HOME override + shared scratch path fixed alongside) made a full
      # run fail roughly 1 in 2. A gate that goes red at random gets ignored
      # and then deleted, so the races were fixed first and the suite measured
      # stable over repeated full runs before this line changed. Do not relax
      # this step to `--no-fail-fast || true` or to a subset if it goes red —
      # a red here is the gate working.
      #
      # eval_cache_wiring is still covered; it is simply part of the workspace
      # now rather than the only thing running.
      - name: Run the test suite
        run: cargo test --workspace

      # ── ★ SUI_TEST_ONLINE, THE SAFE HALF ────────────────────────────────
      # This runner installs nix (three steps up) and then never used it for
      # the differentials: `SUI_TEST_ONLINE` was set by NO workflow, so every
      # `skip_if_offline()` call site silently passed and four declared
      # sui-vs-nix gates reported `ok` while no-opping. The measured signature
      # of that vacuity is a 0.00s runtime with zero nix invocations — and
      # `ok`, not `ignored`, which is why nobody saw it.
      #
      # Counted 2026-08-17: **77 `skip_if_offline()` call sites across 21
      # files.** This comment previously said "67 across 20", which was true
      # when written and had drifted by the time anyone re-read it — the exact
      # rot a bare count invites. Reproduce with
      # `grep -rc skip_if_offline --include=*.rs .` and re-measure rather than
      # trusting the number above; it is dated for that reason.
      #
      # The flip was verified locally (darwin/aarch64, nix 2.31.5) binary by
      # binary before landing, NOT flipped blind on the whole workspace. The
      # binaries below are the ones that came back green; each moved from 0.00s
      # to real work (cli_parity 0.00 -> 2.64s, build_parity 0.00 -> 2.24s),
      # which is the inverted vacuity signature and the thing worth checking if
      # one of them ever goes suspiciously fast again.
      #
      # ── EVERY EXCLUSION HAS A REASON. The list below used to claim that and
      # cover 5 binaries while 8 more were silently absent, holding ~30 vacuous
      # `skip_if_offline()` sites — including a byte-level NAR differential. All
      # 13 are now accounted for. Each of the 8 was RUN locally with
      # SUI_TEST_ONLINE=1 (darwin/aarch64, nix 2.31.5, 2026-08-17) and measured
      # against its own offline time; 5 came back green with real work unlocked
      # and were added to the step below.
      #
      #   build_levels          - `assert!(success > 0)` over $HOME/code/github/
      #                           pleme-io, which does not exist on a runner ->
      #                           CI-FATAL. Also hardcodes aarch64-darwin.
      #   flake_eval_categorized - same shape, `assert!(passed >= min_pass)` with
      #                           min_pass 1/6/1 across three tiers -> CI-FATAL.
      #   drv_path_parity        - spawns 8 real flake evals with NO timeout;
      #   flake_eval_mass          unbounded on an operator machine (>180s, never
      #                           finished), vacuous on CI where the repos are
      #                           absent. Note the second-order problem: these
      #                           can only ever be non-vacuous on a machine
      #                           where they hang.
      #   diff_eval_primitives   - RESOLVED 2026-08-17, row added below. It held
      #                           one REAL divergence, `diff_filter_attrs`: sui
      #                           exposed `builtins.filterAttrs`, which nix does
      #                           not have at any feature level. The six
      #                           nixpkgs-lib leaks were dropped from all three
      #                           engines that day.
      #                           ★ Dropping them did NOT by itself make the
      #                           binary green, and that is worth knowing before
      #                           trusting any "removal fixed it" claim: with the
      #                           builtin gone, nix and sui BOTH reject — but
      #                           `run_cases` compares the full JSON including
      #                           the `__error` string, and sui's diagnostics
      #                           reproduce CppNix's wording nowhere
      #                           (`attribute not found: 'x'` vs `error:
      #                           attribute 'x' missing\n at «string»:1:1: …`).
      #                           So the divergence changed CLASS (semantic ->
      #                           message-text) rather than vanishing. The test
      #                           is now `diff_filter_attrs_is_rejected_by_both`
      #                           over a `run_both_reject` helper that compares
      #                           ACCEPT-vs-REJECT only, which is the axis a
      #                           compatibility layer must hold; the surviving
      #                           prose divergence is left explicitly unasserted
      #                           rather than papered over.
      #                           Measured green: 29 passed / 0 failed / 4.17s
      #                           with SUI_TEST_ONLINE=1 (darwin/aarch64, nix
      #                           2.31.5, 2026-08-17), against 0.00s offline —
      #                           the delta this list requires for admission.
      #   system_eval_parity     - CI-FATAL *and* currently broken. Its four
      #                           `nix_repo_*` tests read $HOME/code/github/
      #                           pleme-io/nix (absent on a runner -> vacuous),
      #                           each ran >60s locally, `nix_repo_eval_no_crash`
      #                           FAILED, and `nix_repo_cid_drv_path` overflowed
      #                           its stack -> SIGABRT, so the binary exits 101
      #                           however it is run. 8 skip_if_offline sites,
      #                           still vacuous; unblocking them needs the
      #                           private-repo dependency removed first.
      #                           pending-ci: system_eval_parity (needs a fixture
      #                           repo, not $HOME, and a stack-overflow fix)
      #   marquee_perf_profile   - measured NO DELTA: 5.50s offline vs 5.55s
      #   perf_experiments         online, and 5.54s vs 5.39s. Adding them buys
      #                           CI time and zero coverage — perf_experiments
      #                           has **0** skip_if_offline sites (it was on the
      #                           audit list in error) and marquee's single site
      #                           gates nothing measurable. Both already run in
      #                           the `cargo test --workspace` step above. The
      #                           0.00s->real-work delta IS the admission test;
      #                           these two fail it.
      #
      # ★ The delta, not the exit code, is what qualified each addition
      # (offline -> online, measured 2026-08-17):
      #     nar_parity           0.00s -> 6.78s   (4 sites; the NAR differential)
      #     vs_cppnix            0.00s -> 53.89s  (1 site)
      #     vs_nix_hotshapes     0.00s -> 24.25s  (1 site)
      #     flake_lock_roundtrip 0.00s -> 0.81s   (5 sites)
      #     flake_eval_parity    0.00s -> 0.30s   (2 sites)
      #     diff_eval_primitives 0.00s -> 4.17s   (29 tests, all online-gated)
      # The last two are green and no longer no-op, but their sub-second times
      # say they unlock much less than their site counts suggest — keep the
      # honest claim "these no longer no-op", not "these all ran".
      #
      # ★ DO NOT read "green" here as "N differentials executed". On
      # ubuntu-latest several of these go green for a SECOND, unrelated reason:
      # the DeterminateSystems installer leaves a near-empty store and a
      # flakes-first config, so `resolve_nixpkgs_path()` likely returns None
      # (skipping all 27 nixpkgs-lib rows) and the store-query rows have almost
      # nothing to iterate. This step recovers real coverage on a developer
      # machine and less than its test count suggests on CI. The destination is
      # a pinned-oracle job; until then the honest claim is "these no longer
      # no-op", not "these all ran".
      - name: Run the sui-vs-nix differentials (online)
        env:
          SUI_TEST_ONLINE: "1"
        run: |
          cargo test -p pleme-io-sui --test cli_parity
          cargo test -p sui-build    --test build_parity
          cargo test -p sui-build    --test full_build
          cargo test -p sui-daemon   --test real_nix_client
          cargo test -p sui-eval     --test oracle
          cargo test -p sui-eval     --test oracle_sanity
          cargo test -p sui-eval     --test lang_corpus
          cargo test -p sui-eval     --test diff_eval_nixpkgs_lib
          cargo test -p sui-eval     --test builtin_registry
          cargo test -p sui-compat   --test nar_parity
          cargo test -p sui-eval     --test vs_cppnix
          cargo test -p sui-eval     --test vs_nix_hotshapes
          cargo test -p sui-eval     --test flake_lock_roundtrip
          cargo test -p sui-eval     --test flake_eval_parity
          cargo test -p sui-eval     --test diff_eval_primitives
